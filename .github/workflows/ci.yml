name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The runtime needs OTP 29: `-nominal' types and triple-quoted strings are
# both used, and `docs/getting-started.md' says so.
env:
  OTP: '29'
  REBAR3: '3.27'

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      # `warnings_as_errors' is on, and the optional NIF builds here rather
      # than falling back, so a C-side break fails the build instead of
      # silently taking the pure Erlang path.
      - run: rebar3 compile
      - name: The NIF built, rather than falling back
        run: test -f priv/wasi_file_nif.so

  # Pinned coverage of a real language, and it **fails rather than skips**.
  # `wasm_worker_lang_SUITE` skips without an artifact, which is right for a
  # working copy and wrong for CI, so the checksums are verified in a step of
  # their own first: a missing or mismatched artifact fails the job there,
  # before anything green can be reported by a run that proved less.
  integration:
    name: Integration
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - name: Fetch the language fixtures
        run: |
          scripts/fetch-qjs-fixture.sh
          scripts/fetch-python-fixture.sh
      # The reactor has no release to fetch: nobody publishes a QuickJS with
      # the init()/handle() pair the kernel calls, so it is built here from a
      # pinned tag against a pinned SDK. It carries no checksum: the same SDK
      # emits different bytes on macOS and Linux, so a hash would pin a
      # machine. The build failing is the check; verify-fixtures.sh only
      # confirms the file arrived.
      # Checked before it is used: a replaced release asset would otherwise
      # build the reactors with someone else's compiler. The checksum is the
      # one GitHub reports for the asset, and what it hashed to when pinned.
      - name: Install the pinned WASI SDK
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  /tmp/wasi-sdk.tar.gz" \
            | sha256sum -c -
          mkdir -p "$HOME/.local/opt"
          tar xzf /tmp/wasi-sdk.tar.gz -C "$HOME/.local/opt"
      # The Lua source comes from lua.org, which runners cannot always reach;
      # the script keeps the checksummed tarball here and uses it when present.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/erlang_wasm
          key: lua-source-5.4.9-2335b6c582a5
      - name: Build the QuickJS and Lua reactors
        run: |
          export WASI_SDK="$HOME/.local/opt/wasi-sdk-34.0-x86_64-linux"
          scripts/build-quickjs-reactor.sh
          scripts/build-lua-reactor.sh
      - name: Verify them against their checksums
        run: scripts/verify-fixtures.sh
      # The CPython reactor is **not** built here. Building it means a host
      # CPython cross-build first, about twenty minutes, and running its group
      # costs one 90 s capture per case on top; `test/fixtures/lang/PYTHON.md`
      # has both numbers. Run it deliberately with
      # `rebar3 ct --suite=test/wasm_worker_lang_SUITE --group=python_reactor`.
      #
      # The other artifacts are fetched and verified, and only the JavaScript
      # groups are run. A CPython request costs 48 s, so the same case list is about
      # fifty minutes per configuration; `test/fixtures/lang/PYTHON.md` has the
      # measurement. Verifying it anyway is what keeps the fetch path and the
      # checksum honest, so a broken download fails here rather than the first
      # time somebody runs the group deliberately.
      - run: rebar3 ct --suite=test/wasm_worker_lang_SUITE
      # Every code block in the docs, strictly: the fixtures above are all
      # declared, so a block that needs one must run here rather than skip,
      # and a missing checker tool fails instead of skipping. Node and Python
      # are on the runner; luac is not.
      - name: Install luac
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check every documentation snippet
        env:
          WASM_DOCS_STRICT: "1"
          WASM_DOCS_FIXTURES: qjs,python,qjs_reactor,lua_reactor
        run: rebar3 ct --suite=test/wasm_docs_SUITE

  tests:
    name: Tests
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      # Neither suite is vendored; both skip when absent, and a skipping
      # conformance run proves nothing. `wasm_spec_SUITE' asserts a floor of
      # 65,481 executed assertions and an empty skip list, so this is what
      # makes the run mean something.
      # At the commits `scripts/fetch-suites.sh' names: a moving branch made
      # the same commit of this project pass on one run and fail the next.
      - name: Fetch the specification and WASI test suites
        run: scripts/fetch-suites.sh
      # 1.8 MB of somebody else's program, fetched rather than committed. The
      # suites that read it skip without it, and a skipping suite proves
      # nothing.
      - name: Fetch the QuickJS fixture
        run: scripts/fetch-qjs-fixture.sh
      - run: rebar3 ct

  # wasmtime's own WASI 0.2 and 0.3 test programs, run as wasmtime's tests run
  # them. They are not vendored: `scripts/build-wasmtime-p2.sh' builds them
  # from wasmtime at a pinned tag, which takes a Rust toolchain and the better
  # part of half an hour, so the result is cached on the script, which names
  # the tag. A changed script builds them again. The suites skip without them,
  # which is right in a working copy and wrong here:
  # WASM_REQUIRE_WASMTIME_FIXTURES makes a missing program a failure, so this
  # job cannot pass by running none.
  wasmtime:
    name: wasmtime programs
    needs: compile
    runs-on: ubuntu-latest
    env:
      WASM_REQUIRE_WASMTIME_FIXTURES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - name: Restore wasmtime's programs
        id: programs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test/fixtures/wasmtime-p2
            test/fixtures/wasmtime-p2-serve
            test/fixtures/wasmtime-p3
            test/fixtures/wasmtime-p3-serve
          key: wasmtime-programs-${{ runner.os }}-${{ hashFiles('scripts/build-wasmtime-p2.sh') }}
      # Checked before it is used, as the WASI SDK is: it composes the
      # middleware programs the suites serve.
      - name: Install the pinned wasm-tools
        if: steps.programs.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.256.0/wasm-tools-1.256.0-x86_64-linux.tar.gz
          echo "0b488be25c9e8a74dfa09f7eac614a927ea197f389d8fa5a21ffb1c15deb469d  /tmp/wasm-tools.tar.gz" \
            | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          mv /tmp/wasm-tools-1.256.0-x86_64-linux/wasm-tools "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build wasmtime's programs
        if: steps.programs.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-wasip1
          rustup default 1.97.1
          scripts/build-wasmtime-p2.sh
      # Saved as soon as they are built, so a failing test does not cost the
      # next run the build.
      - name: Keep wasmtime's programs
        if: steps.programs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test/fixtures/wasmtime-p2
            test/fixtures/wasmtime-p2-serve
            test/fixtures/wasmtime-p3
            test/fixtures/wasmtime-p3-serve
          key: ${{ steps.programs.outputs.cache-primary-key }}
      - name: Run them
        run: >-
          rebar3 ct --suite=test/wasm_wasi2_p2_SUITE,test/wasm_wasi2_serve_SUITE,test/wasm_wasi2_http_limits_SUITE,test/wasm_wasi3_p3_SUITE

  lint:
    name: Lint
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - run: rebar3 lint

  docs:
    name: Docs
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      # `rebar3 ex_doc` exits 0 whatever it warns about, so the warnings have to
      # be looked for. They are the one class of doc defect the suites cannot
      # see: `wasm_architecture_SUITE` checks that a function a moduledoc names
      # exists in *that* module, and ex_doc is what checks a qualified
      # `m:f/a` -- which is how a pointer at a private function, and one naming
      # the wrong module entirely, survived to a release.
      # Both halves are needed. `rebar3 ex_doc` returns 0 whatever happens, so
      # the output is the only signal -- and it has two failure shapes, not
      # one: a `warning:` for a reference it cannot resolve, and an edoc
      # doclet `error` that produces no warnings at all because it never got
      # that far. A gate that grepped only for warnings passed a build that
      # had failed outright, which is how this one was first written.
      - name: Build the docs, and fail on a warning or an error
        run: |
          rebar3 ex_doc 2>&1 | tee /tmp/exdoc.log
          if grep -qE "warning:|error in doclet|An unknown error occurred" /tmp/exdoc.log; then
            echo "::error::ex_doc did not build cleanly"
            grep -B1 -A3 -E "warning:|error in doclet" /tmp/exdoc.log
            exit 1
          fi
          test -f doc/index.html

  xref:
    name: Xref
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - run: rebar3 xref

  dialyzer:
    name: Dialyzer
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/default/*_plt
          key: ${{ runner.os }}-plt-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ env.OTP }}-
      - run: rebar3 dialyzer

  # The NIF is C. Two runs of its file suites on Linux:
  #
  # - A check build (-DWASM_NIF_STACK_CHECK) overwrites the stack a path
  #   resolution returned from before its result is used, so a name left
  #   pointing into a finished frame fails the operation every time. Neither
  #   the plain suites nor AddressSanitizer see that one: the stale pointer is
  #   only read by the system call it is passed to, and whether its bytes
  #   survive depends on the machine.
  # - AddressSanitizer, preloaded as `scripts/sanitize.sh' does in a
  #   container, for the memory errors it does watch. WASM_NIF_SANITIZE stays
  #   set for the test run: `rebar3 ct' recompiles, and without it the NIF
  #   would be rebuilt uninstrumented. Leak detection is off because the
  #   emulator keeps its allocations for its whole life.
  nif:
    name: NIF checks
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: The file suites on the check build
        env:
          # Unoptimised and not inlined, so each function keeps its own
          # frame: inlined into its caller, a buffer is the caller's, and a
          # name pointing into it does not go stale in that build.
          WASM_NIF_CFLAGS: -DWASM_NIF_STACK_CHECK -O0 -fno-inline
        run: |
          rebar3 compile
          test -f priv/wasi_file_nif.so
          rebar3 ct --suite=test/wasi_nif_SUITE,test/wasi_SUITE
      - name: The file suites under AddressSanitizer
        env:
          WASM_NIF_SANITIZE: address
        run: |
          rm -rf _build/test priv/wasi_file_nif.so
          rebar3 compile
          test -f priv/wasi_file_nif.so
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          export ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=0:abort_on_error=1
          rebar3 ct --suite=test/wasi_nif_SUITE,test/wasi_SUITE
