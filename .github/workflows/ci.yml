name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The runtime needs OTP 29: `-nominal' types and triple-quoted strings are
# both used, and `docs/getting-started.md' says so.
env:
  OTP: '29'
  REBAR3: '3.27'

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      # `warnings_as_errors' is on, and the optional NIF builds here rather
      # than falling back, so a C-side break fails the build instead of
      # silently taking the pure Erlang path.
      - run: rebar3 compile
      - name: The NIF built, rather than falling back
        run: test -f priv/wasi_file_nif.so

  # The required gate for the worker kernel. It downloads nothing and needs no
  # network, which is what lets it be required: `wasm_worker_kernel_SUITE'
  # builds both its adapters from WAT at test time, so a skip here is a
  # failure rather than a quieter pass.
  #
  # It also runs the two analyses the default profile cannot: `examples/' is an
  # `extra_src_dirs' of other profiles only, so a default-profile xref and
  # dialyzer see none of the kernel or the behaviour it declares.
  kernel:
    name: Kernel
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - run: rebar3 ct --suite=test/wasm_worker_kernel_SUITE
      - run: rebar3 as kernel_check xref
      - run: rebar3 as kernel_check dialyzer

  # Pinned coverage of a real language, and it **fails rather than skips**.
  # `wasm_worker_lang_SUITE` skips without an artifact, which is right for a
  # working copy and wrong for CI, so the checksums are verified in a step of
  # their own first: a missing or mismatched artifact fails the job there,
  # before anything green can be reported by a run that proved less.
  integration:
    name: Integration
    needs: [compile, kernel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - name: Fetch the language fixtures
        run: |
          scripts/fetch-qjs-fixture.sh
          scripts/fetch-python-fixture.sh
      # The reactor has no release to fetch: nobody publishes a QuickJS with
      # the init()/handle() pair the kernel calls, so it is built here from a
      # pinned tag against a pinned SDK. It carries no checksum: the same SDK
      # emits different bytes on macOS and Linux, so a hash would pin a
      # machine. The build failing is the check; verify-fixtures.sh only
      # confirms the file arrived.
      - name: Install the pinned WASI SDK
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          mkdir -p "$HOME/.local/opt"
          tar xzf /tmp/wasi-sdk.tar.gz -C "$HOME/.local/opt"
      - name: Build the QuickJS and Lua reactors
        run: |
          export WASI_SDK="$HOME/.local/opt/wasi-sdk-34.0-x86_64-linux"
          scripts/build-quickjs-reactor.sh
          scripts/build-lua-reactor.sh
      - name: Verify them against their checksums
        run: scripts/verify-fixtures.sh
      # The CPython reactor is **not** built here. Building it means a host
      # CPython cross-build first, about twenty minutes, and running its group
      # costs one 90 s capture per case on top; `test/fixtures/lang/PYTHON.md`
      # has both numbers. Run it deliberately with
      # `rebar3 ct --suite=test/wasm_worker_lang_SUITE --group=python_reactor`.
      #
      # The other artifacts are fetched and verified, and only the JavaScript
      # groups are run. A CPython request costs 48 s, so the same case list is about
      # fifty minutes per configuration; `test/fixtures/lang/PYTHON.md` has the
      # measurement. Verifying it anyway is what keeps the fetch path and the
      # checksum honest, so a broken download fails here rather than the first
      # time somebody runs the group deliberately.
      - run: rebar3 ct --suite=test/wasm_worker_lang_SUITE
      # Every code block in the docs, strictly: the fixtures above are all
      # declared, so a block that needs one must run here rather than skip,
      # and a missing checker tool fails instead of skipping. Node and Python
      # are on the runner; luac is not.
      - name: Install luac
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check every documentation snippet
        env:
          WASM_DOCS_STRICT: "1"
          WASM_DOCS_FIXTURES: qjs,python,qjs_reactor,lua_reactor
        run: rebar3 ct --suite=test/wasm_docs_SUITE

  tests:
    name: Tests
    needs: [compile, kernel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      # Neither suite is vendored; both skip when absent, and a skipping
      # conformance run proves nothing. `wasm_spec_SUITE' asserts a floor of
      # 65,481 executed assertions and an empty skip list, so this is what
      # makes the run mean something.
      - name: Fetch the specification test suite
        run: git clone --depth 1 https://github.com/WebAssembly/testsuite.git
      - name: Fetch the WASI test suite
        run: |
          git clone --depth 1 --branch prod/testsuite-base \
            https://github.com/WebAssembly/wasi-testsuite.git
      # 1.8 MB of somebody else's program, fetched rather than committed. The
      # suites that read it skip without it, and a skipping suite proves
      # nothing.
      - name: Fetch the QuickJS fixture
        run: scripts/fetch-qjs-fixture.sh
      - run: rebar3 ct

  lint:
    name: Lint
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - run: rebar3 lint

  docs:
    name: Docs
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      # `rebar3 ex_doc` exits 0 whatever it warns about, so the warnings have to
      # be looked for. They are the one class of doc defect the suites cannot
      # see: `wasm_architecture_SUITE` checks that a function a moduledoc names
      # exists in *that* module, and ex_doc is what checks a qualified
      # `m:f/a` -- which is how a pointer at a private function, and one naming
      # the wrong module entirely, survived to a release.
      # Both halves are needed. `rebar3 ex_doc` returns 0 whatever happens, so
      # the output is the only signal -- and it has two failure shapes, not
      # one: a `warning:` for a reference it cannot resolve, and an edoc
      # doclet `error` that produces no warnings at all because it never got
      # that far. A gate that grepped only for warnings passed a build that
      # had failed outright, which is how this one was first written.
      - name: Build the docs, and fail on a warning or an error
        run: |
          rebar3 ex_doc 2>&1 | tee /tmp/exdoc.log
          if grep -qE "warning:|error in doclet|An unknown error occurred" /tmp/exdoc.log; then
            echo "::error::ex_doc did not build cleanly"
            grep -B1 -A3 -E "warning:|error in doclet" /tmp/exdoc.log
            exit 1
          fi
          test -f doc/index.html

  xref:
    name: Xref
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - run: rebar3 xref

  dialyzer:
    name: Dialyzer
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-rebar3-${{ env.OTP }}-
      - uses: actions/cache@v4
        with:
          path: _build/default/*_plt
          key: ${{ runner.os }}-plt-${{ env.OTP }}-${{ hashFiles('rebar.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ env.OTP }}-
      - run: rebar3 dialyzer
